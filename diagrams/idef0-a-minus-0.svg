<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="330" y="391.755">Техническое задание (черновик) и</tspan><tspan x="330" y="406.055">исходные материалы (ИП 7–8)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="330" y="446.755">Обратная связь и запросы</tspan><tspan x="330" y="461.055">сопровождения (ИП 24–25)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="1260" y="336.755">Готовый программный продукт (ИП</tspan><tspan x="1260" y="351.055">21)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="1260" y="391.755">Проектная и пользовательская</tspan><tspan x="1260" y="406.055">документация (ИП 23)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="1260" y="439.605">Подписанный акт сдачи-приёмки,</tspan><tspan x="1260" y="453.905">закрывающие документы (ИП</tspan><tspan x="1260" y="468.205">21–22)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="590" y="86.605">Договор с заказчиком и</tspan><tspan x="590" y="100.905">приложения: рамки, сроки,</tspan><tspan x="590" y="115.205">бюджет (ИП 4)</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="810" y="140.755">Стандарты и регламенты: ГОСТ</tspan><tspan x="810" y="155.055">34.602, внутренние методики</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="1030" y="187.755">План-график работ и бюджет</tspan><tspan x="1030" y="202.055">проекта</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="11" fill="#14213d" text-anchor="middle"><tspan x="740" y="615.605">Персонал: аналитики, архитектор,</tspan><tspan x="740" y="629.905">дизайнеры, разработчики, QA,</tspan><tspan x="740" y="644.205">DevOps, PM</tspan></text>
