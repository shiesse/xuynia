<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="10.8" fill="#14213d" text-anchor="start"><tspan x="676" y="812">Вход — то, что перерабатывается процессом: требования и материалы заказчика, обратная связь сопровождения.</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="10.8" fill="#14213d" text-anchor="start"><tspan x="676" y="835">Управление — ограничения и правила: договор, стандарты (ГОСТ 34.602), план-график и бюджет.</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="10.8" fill="#14213d" text-anchor="start"><tspan x="676" y="858">Механизм — исполнители и инструменты: персонал проектных ролей и набор систем (Jira, Git, CI/CD, Figma).</tspan></text>
<text font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif" font-size="10.8" fill="#14213d" text-anchor="start"><tspan x="676" y="881">Выход — результат бизнеса: готовый продукт, документация, подписанный акт сдачи-приёмки.</tspan></text>
